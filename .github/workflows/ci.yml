name: build-test-pack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory artifacts/test-results
      - run: dotnet pack -c Release --no-build
      - name: Read package version
        run: |
          version="$(dotnet msbuild packaging/UO.Analyzers.Package/UO.Analyzers.Package.csproj -nologo -getProperty:PackageVersion)"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - run: python3 scripts/verify-package.py "artifacts/packages/UO.Analyzers.${PACKAGE_VERSION}.nupkg"
      - run: dotnet restore tests/PackageConsumer/PackageConsumer.csproj -p:AnalyzerPackageVersion="$PACKAGE_VERSION" --source ./artifacts/packages --source https://api.nuget.org/v3/index.json --packages ./artifacts/consumer-packages
      - run: dotnet build tests/PackageConsumer/PackageConsumer.csproj -c Release --no-restore -p:AnalyzerPackageVersion="$PACKAGE_VERSION"
      - run: python3 scripts/verify-package.py "artifacts/packages/UO.Analyzers.${PACKAGE_VERSION}.nupkg" --consumer tests/PackageConsumer
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: packages-and-test-results
          path: |
            artifacts/packages/*.nupkg
            artifacts/test-results/*.trx
