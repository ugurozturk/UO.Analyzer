name: publish-nuget

on:
  workflow_run:
    workflows: [build-test-pack]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Download verified package from the triggering CI run
        uses: actions/download-artifact@v7
        with:
          name: packages-and-test-results
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to NuGet.org with Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: uozturk
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "::error::NuGet Trusted Publishing did not return a temporary API key."
            exit 1
          fi
          shopt -s nullglob
          packages=(artifacts/packages/UO.Analyzers.*.nupkg)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one verified UO.Analyzers package."
            exit 1
          fi
          dotnet nuget push "${packages[0]}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
